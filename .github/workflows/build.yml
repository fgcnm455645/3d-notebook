name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir -p proj
          unzip -q -o "$(ls *.zip | head -n 1)" -d proj
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          echo "PROJ_DIR=$DIR" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: cd "$PROJ_DIR" && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Notebook-debug
          path: ${{ env.PROJ_DIR }}/app/build/outputs/apk/debug/*.apk
